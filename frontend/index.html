<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OASIS - Gestão Condominial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Desativa permanentemente os botões nativos e efêmeros de senha do Edge/Chromium */
      input::-ms-reveal,
      input::-ms-clear {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans text-slate-800 antialiased selection:bg-navy/15 selection:text-navy">
    <div id="root"></div>

  </body>
</html>
