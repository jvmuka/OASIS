services:
  # ----------------------------------------------------
  # 1. Banco de Dados PostgreSQL 16
  # ----------------------------------------------------
  banco:
    image: postgres:16-alpine
    container_name: oasis-banco
    restart: unless-stopped
    command: postgres -c timezone=America/Sao_Paulo
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_DB: oasis
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5433:5432"
    volumes:
      - oasis_pgdata:/var/lib/postgresql/data
      - ./banco/oasis_banco_completo.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - oasis-net
    healthcheck:
      # -h 127.0.0.1 forca a verificacao via TCP: durante a carga inicial o
      # PostgreSQL temporario atende apenas pelo socket local, e o backend nao
      # deve iniciar antes de o banco definitivo aceitar conexoes de rede.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d oasis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------
  # 2. Backend NestJS (API REST)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oasis-backend
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_ENCODED:?Defina POSTGRES_PASSWORD_ENCODED no .env}@banco:5432/oasis
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (minimo 32 caracteres)}
      DEV_SENHA: ${DEV_SENHA:-Teste@2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - oasis_uploads:/app/uploads
    networks:
      - oasis-net

  # ----------------------------------------------------
  # 3. Frontend React / Vite (Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oasis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - oasis-net

# ----------------------------------------------------
# Volumes e Redes
# ----------------------------------------------------
volumes:
  oasis_pgdata:
    name: oasis_pgdata
  oasis_uploads:
    name: oasis_uploads

networks:
  oasis-net:
    name: oasis-net
    driver: bridge
